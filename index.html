<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A CA LA CHARO · Café y barra de barrio en El Carmen, Madrid</title>
    <meta name="description" content="A CA LA CHARO: el bar de barrio de toda la vida, con café de especialidad y platos tradicionales reinventados. Barrio de El Carmen, Madrid.">
    <link rel="icon" href="img/logo-azul.svg" type="image/svg+xml">

    <!-- Tipografías: Archivo Black (títulos) y DM Sans (textos) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">


    <!-- Nuestro CSS propio -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header id="cabecera" class="cabecera-transparente fixed inset-x-0 top-0 z-30 border-b-2 border-azul bg-crema/95 backdrop-blur transition-colors duration-300 dark:border-celeste/40 dark:bg-noche/95">
        <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-5 py-3">
            <a href="#inicio" class="rounded-lg">
                <!-- Un logo para cada modo: dark:hidden / dark:block -->
                <img src="img/logo-azul.svg" alt="A CA LA CHARO, ir al inicio" width="752" height="687" class="logo-azul h-12 w-auto md:h-14 dark:hidden">
                <img src="img/logo-blanco.svg" alt="A CA LA CHARO, ir al inicio" width="752" height="687" class="logo-blanco hidden h-12 w-auto md:h-14 dark:block">
            </a>

            <div class="flex items-center gap-2 lg:order-last">
                <!-- Botón de modo claro / oscuro: solo icono (luna o sol) -->
                <button id="boton-tema" type="button" aria-pressed="false" aria-label="Modo oscuro" title="Cambiar entre modo claro y oscuro"
                        class="grid size-11 place-items-center rounded-full border-2 border-azul transition hover:bg-azul hover:text-crema dark:border-celeste dark:text-celeste dark:hover:bg-celeste dark:hover:text-noche">
                    <!-- Luna (se ve en modo claro) -->
                    <svg class="size-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                    <!-- Sol (se ve en modo oscuro) -->
                    <svg class="hidden size-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                </button>

                <!-- Botón del menú (en móvil y tablet) -->
                <button id="boton-menu" type="button" aria-expanded="false" aria-controls="menu"
                        class="rounded-full border-2 border-azul bg-azul px-4 py-2 text-sm font-bold text-crema transition hover:bg-crema hover:text-azul lg:hidden dark:border-celeste dark:bg-celeste dark:text-noche">
                    Menú
                </button>
            </div>

            <nav class="w-full lg:ml-auto lg:w-auto" aria-label="Principal">
                <ul id="menu" class="hidden space-y-1 pb-3 lg:flex lg:items-center lg:gap-6 lg:space-y-0 lg:pb-0">
                    <li><a href="#historia" class="enlace-menu block py-2 text-sm font-bold tracking-wider uppercase">Nuestra historia</a></li>
                    <li><a href="carta.html" class="enlace-menu block py-2 text-sm font-bold tracking-wider uppercase">La carta</a></li>
                    <li><a href="#novedades" class="enlace-menu block py-2 text-sm font-bold tracking-wider uppercase">Novedades</a></li>
                    <li><a href="#club" class="enlace-menu block py-2 text-sm font-bold tracking-wider uppercase">Club Charo</a></li>
                    <li><a href="#visitanos" class="enlace-menu block py-2 text-sm font-bold tracking-wider uppercase">Dónde estamos</a></li>
                    <li><a href="#pedidos" class="mt-2 inline-block rounded-full bg-azul px-5 py-2 text-sm font-bold tracking-wider text-crema uppercase transition hover:bg-celeste hover:text-azul lg:mt-0 dark:bg-celeste dark:text-noche dark:hover:bg-crema">Pedir a domicilio</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

        <!-- HERO / PORTADA -->
        <section id="inicio">

            <video autoplay muted loop playsinline>
                <source src="video/portada.mp4" type="video/mp4">
            </video>

            <div>
                <h1>
                    Un bar de los<br>
                    de siempre,<br>
                    pero distinto.
                </h1>

                <p>
                    Pasa, que la Charo ya te está poniendo el café.
                    Y si quieres tortilla, con cebolla (obvio).
                </p>

                <a href="carta.html">Ver la carta</a>
                <a href="#visitanos">Dónde estamos</a>
            </div>

        </section>

    </main>

    <script src="js/main.js"></script>

</body>
</html>
